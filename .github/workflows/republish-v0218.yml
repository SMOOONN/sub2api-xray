name: Verify v0.2.18 republish

on:
  push:
    branches: [main]
    paths: ['.github/workflows/republish-v0218.yml']
  delete:

permissions:
  contents: read

jobs:
  diagnose:
    if: ${{ github.event_name == 'push' && github.event.deleted != true }}
    runs-on: ubuntu-latest
    container: python:3.12-bookworm
    permissions:
      actions: read
      contents: read
    steps:
      - name: Read the failed candidate image import
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          test -f /.dockerenv
          python - <<'PY'
          import os
          import re
          from urllib.error import HTTPError
          from urllib.request import HTTPRedirectHandler, Request, build_opener, urlopen
          class NoRedirect(HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  return None
          req = Request('https://api.github.com/repos/SMOOONN/sub2api-xray/actions/jobs/123506172866/logs', headers={
              'Authorization': 'Bearer ' + os.environ['GITHUB_TOKEN'],
              'Accept': 'application/vnd.github+json',
          })
          try:
              response = build_opener(NoRedirect).open(req, timeout=30)
          except HTTPError as error:
              if error.code != 302:
                  raise RuntimeError(f'Log retrieval HTTP {error.code}') from None
              with urlopen(error.headers['Location'], timeout=30) as response:
                  lines = response.read().decode('utf-8', 'replace').splitlines()
          else:
              with response:
                  lines = response.read().decode('utf-8', 'replace').splitlines()
          selected = [line for line in lines if '2026-10-29T14:22:44' in line or '2026-10-29T14:22:45' in line]
          safe = '\n'.join(selected[-50:]).replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print('::notice title=Previous image verification::' + safe)
          PY
  audit:
    if: ${{ github.event_name == 'push' && github.event.deleted != true }}
    runs-on: ubuntu-latest
    container: python:3.12-bookworm
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v6
      - name: Check the exact old release and image inventory
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          test -f /.dockerenv
          python .github/release-tools/republish_v0218.py audit
      - uses: actions/upload-artifact@v7
        with:
          name: old-release-inventory
          path: republish-receipt.json
          retention-days: 3
  prebuild:
    if: ${{ github.event_name == 'push' && github.event.deleted != true }}
    needs: audit
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ github.sha }}
      dry_run: true
      simple_release: false
  withdraw:
    if: ${{ github.event_name == 'delete' && github.event.ref_type == 'tag' && github.event.ref == 'v0.2.18-xray6' && github.actor == 'SMOOONN' }}
    runs-on: ubuntu-latest
    container: python:3.12-bookworm
    permissions:
      contents: write
      packages: write
      actions: read
    steps:
      - uses: actions/checkout@v6
      - name: Withdraw only the verified old v0.2.18 release objects
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          test -f /.dockerenv
          python .github/release-tools/republish_v0218.py withdraw
      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: old-release-withdrawal
          path: republish-receipt.json
          if-no-files-found: warn
          retention-days: 3
