name: Release
run-name: Release ${{ inputs.tag || github.ref_name }}

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (or a branch/ref for dry run)'
        required: true
        type: string
      simple_release:
        description: 'Simple release: only x86_64 GHCR image, skip other artifacts'
        required: false
        type: boolean
        default: false
      dry_run:
        description: 'Build and verify all selected artifacts without publishing'
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      simple_release:
        required: false
        type: boolean
        default: false
      dry_run:
        required: false
        type: boolean
        default: false

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  SIMPLE_RELEASE: ${{ inputs.simple_release == true }}
  DRY_RUN: ${{ inputs.dry_run == true }}
  DOCKERHUB_USERNAME: skip

jobs:
  prepare:
    if: ${{ github.event_name != 'push' || github.event.deleted != true }}
    runs-on: ubuntu-latest
    container: python:3.12-bookworm
    outputs:
      sha: ${{ steps.plan.outputs.sha }}
      owner_lower: ${{ steps.plan.outputs.owner_lower }}
      tag: ${{ steps.plan.outputs.tag }}
      version: ${{ steps.plan.outputs.version }}
      date: ${{ steps.plan.outputs.date }}
      matrix: ${{ steps.plan.outputs.matrix }}
      simple: ${{ steps.plan.outputs.simple }}
      dry_run: ${{ steps.plan.outputs.dry_run }}
    steps:
      - name: Require an isolated job container
        run: |
          test -f /.dockerenv
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Checkout workflow tooling
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - name: Preserve tooling for releases of older tags
        run: cp -R .github/release-tools "$RUNNER_TEMP/release-tools"
      - name: Checkout selected application source
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - run: python -m pip install -r "$RUNNER_TEMP/release-tools/requirements-release.txt"
      - name: Resolve one source commit and target matrix
        id: plan
        env:
          REQUESTED_REF: ${{ inputs.tag || github.ref_name }}
        run: |
          args=(--ref "$REQUESTED_REF")
          if [[ "$SIMPLE_RELEASE" == true ]]; then args+=(--simple); fi
          if [[ "$DRY_RUN" == true ]]; then args+=(--dry-run); fi
          python "$RUNNER_TEMP/release-tools/release_matrix.py" plan "${args[@]}"
          python "$RUNNER_TEMP/release-tools/release_matrix.py" preflight
          if [[ "$DRY_RUN" != true ]]; then
            python "$RUNNER_TEMP/release-tools/release_matrix.py" notes --tag "$REQUESTED_REF"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: release-tooling
          path: ${{ runner.temp }}/release-tools/
          retention-days: 1
      - uses: actions/upload-artifact@v7
        with:
          name: version-file
          path: backend/cmd/server/VERSION
          retention-days: 1

  build-frontend:
    needs: prepare
    runs-on: ubuntu-latest
    container: node:24-bookworm
    steps:
      - name: Prepare the isolated build container
        run: |
          test -f /.dockerenv
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          apt-get update
          apt-get install -y --no-install-recommends xz-utils zstd
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.9
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm run build
        working-directory: frontend
      - uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: backend/internal/web/dist/
          retention-days: 1

  build-binaries:
    needs: [prepare, build-frontend]
    runs-on: ubuntu-latest
    container: golang:1.27.3-bookworm
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_DATE: ${{ needs.prepare.outputs.date }}
      GOTOOLCHAIN: local
    steps:
      - name: Prepare the isolated build container
        run: |
          test -f /.dockerenv
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          apt-get update
          apt-get install -y --no-install-recommends python3-venv xz-utils zstd
          python3 -m venv "$RUNNER_TEMP/release-tools-venv"
          echo "$RUNNER_TEMP/release-tools-venv/bin" >> "$GITHUB_PATH"
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: release-tooling
          path: ${{ runner.temp }}/release-tools/
      - uses: actions/download-artifact@v8
        with:
          name: version-file
          path: backend/cmd/server/
      - uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: backend/internal/web/dist/
      - name: Verify Go version
        run: go version | grep -q 'go1.27.3'
      - name: Restore target-specific Go cache
        id: go-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            /go/pkg/mod
            ~/.cache/go-build
          key: release-go-${{ runner.os }}-${{ runner.arch }}-${{ matrix.goos }}-${{ matrix.goarch }}-${{ hashFiles('backend/go.mod', 'backend/go.sum') }}-${{ needs.prepare.outputs.sha }}
          restore-keys: |
            release-go-${{ runner.os }}-${{ runner.arch }}-${{ matrix.goos }}-${{ matrix.goarch }}-${{ hashFiles('backend/go.mod', 'backend/go.sum') }}-
            release-go-${{ runner.os }}-${{ runner.arch }}-${{ matrix.goos }}-${{ matrix.goarch }}-
      - run: python -m pip install -r "$RUNNER_TEMP/release-tools/requirements-release.txt"
      - name: Select one GoReleaser target
        id: matrix_config
        env:
          TARGET_OS: ${{ matrix.goos }}
          TARGET_ARCH: ${{ matrix.goarch }}
        run: |
          config_path="$RUNNER_TEMP/goreleaser.matrix.yaml"
          python "$RUNNER_TEMP/release-tools/release_matrix.py" config build --goos "$TARGET_OS" --goarch "$TARGET_ARCH" --output "$config_path"
          echo "config_path=$config_path" >> "$GITHUB_OUTPUT"
      - name: Build and archive without publishing
        uses: goreleaser/goreleaser-action@v7
        with:
          version: 'v2.19.0'
          args: release --snapshot --clean --skip=validate,publish,docker,announce --config=${{ steps.matrix_config.outputs.config_path }}
        env:
          GITHUB_REPO_OWNER: ${{ github.repository_owner }}
          GITHUB_REPO_OWNER_LOWER: ${{ needs.prepare.outputs.owner_lower }}
          GITHUB_REPO_NAME: ${{ github.event.repository.name }}
          DOCKERHUB_USERNAME: skip
          TAG_MESSAGE: ''
      - name: Verify and collect the target archive
        env:
          TARGET_OS: ${{ matrix.goos }}
          TARGET_ARCH: ${{ matrix.goarch }}
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
        run: python "$RUNNER_TEMP/release-tools/release_matrix.py" collect --version "$RELEASE_VERSION" --sha "$RELEASE_SHA" --goos "$TARGET_OS" --goarch "$TARGET_ARCH" --output matrix-output
      - uses: actions/upload-artifact@v7
        with:
          name: release-binary-${{ matrix.goos }}-${{ matrix.goarch }}
          path: matrix-output/
          if-no-files-found: error
          retention-days: 1
      - name: Save updated target cache
        if: ${{ steps.go-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: |
            /go/pkg/mod
            ~/.cache/go-build
          key: ${{ steps.go-cache.outputs.cache-primary-key }}

  release:
    needs: [prepare, build-binaries]
    runs-on: ubuntu-latest
    container: golang:1.27.3-bookworm
    permissions:
      contents: write
      packages: write
    env:
      SIMPLE_RELEASE: ${{ needs.prepare.outputs.simple }}
      DRY_RUN: ${{ needs.prepare.outputs.dry_run }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
      GOTOOLCHAIN: local
    steps:
      - name: Prepare the isolated publishing container
        run: |
          test -f /.dockerenv
          test -S /var/run/docker.sock
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          apt-get update
          apt-get install -y --no-install-recommends python3-venv skopeo xz-utils zstd
          python3 -m venv "$RUNNER_TEMP/release-tools-venv"
          echo "$RUNNER_TEMP/release-tools-venv/bin" >> "$GITHUB_PATH"
          curl --fail --location --retry 3 \
            https://download.docker.com/linux/static/stable/x86_64/docker-28.5.1.tgz \
            --output "$RUNNER_TEMP/docker-cli.tgz"
          tar -xzf "$RUNNER_TEMP/docker-cli.tgz" --directory /usr/local/bin --strip-components=1 docker/docker
          docker version
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: release-tooling
          path: ${{ runner.temp }}/release-tools/
      - uses: actions/download-artifact@v8
        with:
          pattern: release-binary-*
          path: release-input
          merge-multiple: true
      - run: python -m pip install -r "$RUNNER_TEMP/release-tools/requirements-release.txt"
      - name: Verify complete matrix and prepare Docker contexts
        run: |
          args=(--version "$RELEASE_VERSION" --sha "$RELEASE_SHA" --input release-input --output .release-context)
          if [[ "$SIMPLE_RELEASE" == true ]]; then args+=(--simple); fi
          python "$RUNNER_TEMP/release-tools/release_matrix.py" contexts "${args[@]}"
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GitHub Container Registry
        if: ${{ env.DRY_RUN != 'true' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build images and publish manifests
        run: bash "$RUNNER_TEMP/release-tools/release-images.sh"
      - name: Verify candidate or published image runtimes
        run: |
          arches=(amd64 arm64)
          if [[ "$SIMPLE_RELEASE" == true ]]; then arches=(amd64); fi
          for arch in "${arches[@]}"; do
            if [[ "$DRY_RUN" == true ]]; then
              archive="$RUNNER_TEMP/sub2api-$arch.oci.tar"
              test -s "$archive"
              image="sub2api-candidate:$arch"
              skopeo --override-os linux --override-arch "$arch" copy --format v2s2 \
                "oci-archive:$archive" "docker-daemon:$image"
            else
              image="ghcr.io/${GITHUB_REPOSITORY,,}:$RELEASE_VERSION"
              docker pull --platform "linux/$arch" "$image"
            fi
            version_output=$(docker run --rm --pull=never --platform "linux/$arch" --entrypoint /app/sub2api "$image" -version 2>&1)
            printf '%s\n' "$version_output"
            grep -F "$RELEASE_VERSION (commit: $RELEASE_SHA," <<< "$version_output"
            docker run --rm --pull=never --platform "linux/$arch" --entrypoint /usr/local/bin/xray "$image" version
            docker run --rm --pull=never --platform "linux/$arch" --entrypoint /usr/local/bin/sing-box "$image" version
          done
      - name: Preserve validated dry-run OCI images
        if: ${{ env.DRY_RUN == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: release-dry-run-images
          path: ${{ runner.temp }}/sub2api-*.oci.tar
          if-no-files-found: error
          retention-days: 1
      - name: Recheck the canonical release notes
        if: ${{ env.DRY_RUN != 'true' }}
        run: python "$RUNNER_TEMP/release-tools/release_matrix.py" notes --tag "$RELEASE_TAG"
      - name: Prepare publication-only GoReleaser config
        id: publisher_config
        run: |
          config_path="$RUNNER_TEMP/goreleaser.publisher.yaml"
          args=(publish --output "$config_path")
          if [[ "$SIMPLE_RELEASE" == true ]]; then args+=(--simple); fi
          python "$RUNNER_TEMP/release-tools/release_matrix.py" config "${args[@]}"
          echo "config_path=$config_path" >> "$GITHUB_OUTPUT"
      - name: Publish existing archives and release notes
        uses: goreleaser/goreleaser-action@v7
        with:
          version: 'v2.19.0'
          args: release --clean --skip=validate,before,docker ${{ env.DRY_RUN == 'true' && '--snapshot --skip=publish,announce' || format('--release-notes=docs/releases/{0}_CN.md', needs.prepare.outputs.tag) }} --config=${{ steps.publisher_config.outputs.config_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ needs.prepare.outputs.tag }}
          GITHUB_REPO_OWNER: ${{ github.repository_owner }}
          GITHUB_REPO_NAME: ${{ github.event.repository.name }}
          GITHUB_REPO_OWNER_LOWER: ${{ needs.prepare.outputs.owner_lower }}
      - name: Upload dry-run checksums and metadata
        if: ${{ env.DRY_RUN == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: release-dry-run-report
          path: |
            dist/checksums.txt
            dist/artifacts.json
            dist/metadata.json
          if-no-files-found: error
          retention-days: 3
      - name: Verify the published release against this build
        if: ${{ env.DRY_RUN != 'true' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          args=(--tag "$RELEASE_TAG" --checksums dist/checksums.txt)
          if [[ "$SIMPLE_RELEASE" == true ]]; then args+=(--simple); fi
          python "$RUNNER_TEMP/release-tools/release_matrix.py" publication "${args[@]}"
