name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      run_native_macos:
        description: 'Explicitly run native macOS deployment checks outside a Linux container'
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  shell:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_native_macos == true }}
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - name: Check deployment scripts
        run: |
          /bin/bash -n deploy/apple-container.sh
          /bin/bash deploy/tests/apple-container-test.sh
  shell-linux:
    runs-on: ubuntu-latest
    container: python:3.12-bookworm
    steps:
      - name: Require an isolated job container
        run: test -f /.dockerenv
      - uses: actions/checkout@v6
      - name: Check portable deployment scripts
        run: |
          /bin/sh deploy/tests/docker-compose-security-test.sh
          /bin/sh deploy/tests/docker-compose-gateway-env-test.sh
          /bin/sh deploy/tests/docker-runtime-resources-test.sh
          /bin/sh deploy/test-caddyfile-cache.sh

  test:
    runs-on: ubuntu-latest
    container:
      image: golang:1.27.3-bookworm
      options: --add-host=host.docker.internal:host-gateway
    env:
      GOTOOLCHAIN: local
      TESTCONTAINERS_HOST_OVERRIDE: host.docker.internal
    steps:
      - name: Require an isolated job container
        run: |
          test -f /.dockerenv
          test -S /var/run/docker.sock
      - uses: actions/checkout@v6
      - name: Check Docker Compose simple mode environment
        run: /bin/sh deploy/tests/docker-compose-simple-mode-env-test.sh
      - name: Verify Go version
        run: |
          go version | grep -q 'go1.27.3'
      - name: Unit tests
        working-directory: backend
        run: make test-unit
      - name: Integration tests
        working-directory: backend
        run: make test-integration

  frontend:
    runs-on: ubuntu-latest
    container: node:20-bookworm
    steps:
      - name: Prepare the isolated job container
        run: |
          test -f /.dockerenv
          apt-get update
          apt-get install -y --no-install-recommends xz-utils zstd
      - uses: actions/checkout@v6
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Frontend typecheck and critical vitest
        run: make test-frontend

  golangci-lint:
    runs-on: ubuntu-latest
    container: golang:1.27.3-bookworm
    env:
      GOTOOLCHAIN: local
    steps:
      - name: Prepare the isolated job container
        run: |
          test -f /.dockerenv
          apt-get update
          apt-get install -y --no-install-recommends xz-utils zstd
      - uses: actions/checkout@v6
      - name: Verify Go version
        run: |
          go version | grep -q 'go1.27.3'
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          args: --timeout=30m
          working-directory: backend

  release-helpers:
    runs-on: ubuntu-latest
    container: python:3.12-bookworm
    steps:
      - name: Require an isolated job container
        run: test -f /.dockerenv
      - uses: actions/checkout@v6
      - run: python -m pip install -r .github/release-tools/requirements-release.txt
      - run: python -m unittest discover -s .github/release-tools -p 'test_release_matrix.py'
      - run: bash -n .github/release-tools/release-images.sh
