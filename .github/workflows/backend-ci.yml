name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      run_native_macos:
        description: 'Explicitly run native macOS deployment checks outside a Linux container'
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  shell:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_native_macos == true }}
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - name: Check deployment scripts
        run: |
          /bin/bash -n deploy/apple-container.sh
          /bin/bash deploy/tests/apple-container-test.sh
  shell-linux:
    runs-on: ubuntu-latest
    container: python:3.12-bookworm
    steps:
      - name: Require an isolated job container
        run: test -f /.dockerenv
      - uses: actions/checkout@v6
      - name: Install Docker CLI and Compose in the job container
        run: |
          curl --fail --location --retry 3 \
            https://download.docker.com/linux/static/stable/x86_64/docker-28.5.1.tgz \
            --output "$RUNNER_TEMP/docker-cli.tgz"
          tar -xzf "$RUNNER_TEMP/docker-cli.tgz" --directory /usr/local/bin --strip-components=1 docker/docker
          mkdir -p /usr/local/lib/docker/cli-plugins
          curl --fail --location --retry 3 \
            https://github.com/docker/compose/releases/download/v5.6.1/docker-compose-linux-x86_64 \
            --output /usr/local/lib/docker/cli-plugins/docker-compose
          chmod +x /usr/local/lib/docker/cli-plugins/docker-compose
          docker --version
          docker compose version
      - name: Check Docker Compose simple mode environment
        run: /bin/sh deploy/tests/docker-compose-simple-mode-env-test.sh
      - name: Check portable deployment scripts
        run: |
          /bin/sh deploy/tests/docker-compose-security-test.sh
          /bin/sh deploy/tests/docker-compose-gateway-env-test.sh
          /bin/sh deploy/tests/docker-runtime-resources-test.sh
          /bin/sh deploy/test-caddyfile-cache.sh

  test:
    runs-on: ubuntu-latest
    container:
      image: golang:1.27.3-bookworm
      options: --add-host=host.docker.internal:host-gateway
    env:
      GOTOOLCHAIN: local
      TESTCONTAINERS_HOST_OVERRIDE: host.docker.internal
    steps:
      - name: Require an isolated job container
        run: |
          test -f /.dockerenv
          test -S /var/run/docker.sock
          curl --fail --location --retry 3 \
            https://download.docker.com/linux/static/stable/x86_64/docker-28.5.1.tgz \
            --output "$RUNNER_TEMP/docker-cli.tgz"
          tar -xzf "$RUNNER_TEMP/docker-cli.tgz" --directory /usr/local/bin --strip-components=1 docker/docker
          docker --version
          docker info --format '{{.ServerVersion}}'
      - uses: actions/checkout@v6
      - name: Verify Go version
        run: |
          go version | grep -q 'go1.27.3'
      - name: Unit tests
        working-directory: backend
        run: make test-unit
      - name: Integration tests
        working-directory: backend
        run: |
          report="$RUNNER_TEMP/integration-tests.log"
          set +e
          make test-integration 2>&1 | tee "$report"
          test_status=${PIPESTATUS[0]}
          set -e
          if [[ "$test_status" -ne 0 ]]; then
            if ! awk '
              /^[[:space:]]*--- FAIL: [A-Za-z_][A-Za-z0-9_]*/ {
                name = $0
                sub(/^[[:space:]]*--- FAIL: /, "", name)
                sub(/[^A-Za-z0-9_].*$/, "", name)
                if (!tests[name]++) print "::error title=Integration test failed::" name
              }
              $1 == "FAIL" && $2 ~ /^github[.]com\/Wei-Shaw\/sub2api(\/[A-Za-z0-9_.-]+)*$/ {
                if (!packages[$2]++) print "::error title=Integration package failed::" $2
              }
              {
                line = tolower($0)
                if (line ~ /docker is not available/ && !infra["docker"]++)
                  print "::error title=Integration infrastructure::Observed category: Docker availability check failed"
                if (line ~ /cannot connect to the docker daemon|permission denied.*docker[.]sock|docker[.]sock.*permission denied/ && !infra["socket"]++)
                  print "::error title=Integration infrastructure::Observed category: Docker daemon or socket access failed"
                if (line ~ /failed to start postgres container|failed to start redis container|creating reaper failed/ && !infra["startup"]++)
                  print "::error title=Integration infrastructure::Observed category: Test container startup failed"
                if (line ~ /dial tcp.*connection refused|dial tcp.*i\/o timeout|no such host|tls handshake timeout/ && !infra["network"]++)
                  print "::error title=Integration infrastructure::Observed category: Network connection or name resolution failed"
                if (line ~ /manifest unknown|pull access denied|toomanyrequests|unauthorized: authentication required/ && !infra["registry"]++)
                  print "::error title=Integration infrastructure::Observed category: Container image registry access failed"
              }
            ' "$report"; then
              printf '::warning title=Integration diagnostics::Could not extract sanitized failure identifiers\n'
            fi
            printf '::error title=Integration tests::make test-integration exited with status %s\n' "$test_status"
          fi
          exit "$test_status"

  frontend:
    runs-on: ubuntu-latest
    container: node:20-bookworm
    steps:
      - name: Prepare the isolated job container
        run: |
          test -f /.dockerenv
          apt-get update
          apt-get install -y --no-install-recommends xz-utils zstd
      - uses: actions/checkout@v6
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Frontend typecheck and critical vitest
        run: make test-frontend

  golangci-lint:
    runs-on: ubuntu-latest
    container: golang:1.27.3-bookworm
    env:
      GOTOOLCHAIN: local
    steps:
      - name: Prepare the isolated job container
        run: |
          test -f /.dockerenv
          apt-get update
          apt-get install -y --no-install-recommends xz-utils zstd
      - uses: actions/checkout@v6
      - name: Verify Go version
        run: |
          go version | grep -q 'go1.27.3'
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          args: --timeout=30m
          working-directory: backend

  release-helpers:
    runs-on: ubuntu-latest
    container: python:3.12-bookworm
    steps:
      - name: Require an isolated job container
        run: test -f /.dockerenv
      - uses: actions/checkout@v6
      - run: python -m pip install -r .github/release-tools/requirements-release.txt
      - run: python -m unittest discover -s .github/release-tools -p 'test_release_matrix.py'
      - run: bash -n .github/release-tools/release-images.sh
