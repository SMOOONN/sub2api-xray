name: Temporary GHCR cleanup

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  cleanup-xray3:
    runs-on: ubuntu-latest
    steps:
      - name: Delete v0.1.173-xray3 package versions
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        shell: bash
        run: |
          set -euo pipefail

          endpoint="/users/${OWNER}/packages/container/sub2api-xray/versions"
          versions="$(gh api "${endpoint}?per_page=100")"
          mapfile -t version_ids < <(
            jq -r '.[]
              | select(
                  (.metadata.container.tags // [])
                  | any(
                      . == "0.1.173-xray3"
                      or . == "0.1.173-xray3-amd64"
                      or . == "0.1.173-xray3-arm64"
                      or . == "latest"
                      or . == "0.1"
                      or . == "0"
                    )
                )
              | .id' <<<"${versions}"
          )

          if (( ${#version_ids[@]} < 1 || ${#version_ids[@]} > 6 )); then
            echo "Unexpected matching package-version count: ${#version_ids[@]}" >&2
            exit 1
          fi

          for version_id in "${version_ids[@]}"; do
            gh api "${endpoint}/${version_id}" \
              --jq '{id: .id, tags: .metadata.container.tags}'
            gh api --method DELETE "${endpoint}/${version_id}"
          done

          remaining="$(gh api "${endpoint}?per_page=100")"
          if jq -e '.[]
            | select(
                (.metadata.container.tags // [])
                | any(
                    . == "0.1.173-xray3"
                    or . == "0.1.173-xray3-amd64"
                    or . == "0.1.173-xray3-arm64"
                    or . == "latest"
                    or . == "0.1"
                    or . == "0"
                  )
              )' <<<"${remaining}" >/dev/null; then
            echo "Old GHCR tags still remain after cleanup" >&2
            exit 1
          fi

          echo "Deleted ${#version_ids[@]} GHCR package versions."
