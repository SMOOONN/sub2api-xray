name: Security Scan

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  backend-security:
    runs-on: ubuntu-latest
    container: golang:1.27.3-bookworm
    timeout-minutes: 15
    env:
      GOTOOLCHAIN: local
    steps:
      - name: Require an isolated job container
        run: test -f /.dockerenv
      - uses: actions/checkout@v6
      - name: Verify Go version
        run: |
          go version | grep -q 'go1.27.3'
      - name: Run govulncheck
        working-directory: backend
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          report="$RUNNER_TEMP/govulncheck.txt"
          set +e
          govulncheck ./... > "$report" 2>&1
          scan_status=$?
          set -e
          if [[ "$scan_status" -ne 0 ]]; then
            emit_finding() {
              local title="$1" message="$2"
              message="${message//'%'/'%25'}"
              message="${message//$'\r'/'%0D'}"
              message="${message//$'\n'/'%0A'}"
              printf '::error title=%s::%s\n' "$title" "$message"
            }
            title=govulncheck
            details=
            while IFS= read -r line; do
              if [[ "$line" =~ ^Vulnerability\ #[0-9]+:\ (GO-[0-9]{4}-[0-9]+) ]]; then
                if [[ -n "$details" ]]; then emit_finding "$title" "$details"; fi
                title="${BASH_REMATCH[1]}"
                details="$line"
              elif [[ "$line" =~ ^[[:space:]]*(Module|Package|Found\ in|Fixed\ in): ]] || [[ "$line" =~ ^[[:space:]]*#[0-9]+: ]]; then
                details+=$'\n'"$line"
              fi
            done < "$report"
            if [[ -n "$details" ]]; then emit_finding "$title" "$details"; fi
            emit_finding govulncheck "Scan exited with status $scan_status; package and call-trace findings are listed separately."
          fi
          exit "$scan_status"

  frontend-security:
    runs-on: ubuntu-latest
    container: node:20-bookworm
    steps:
      - name: Prepare the isolated job container
        run: |
          test -f /.dockerenv
          apt-get update
          apt-get install -y --no-install-recommends python3 xz-utils zstd
      - uses: actions/checkout@v6
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Run pnpm audit
        working-directory: frontend
        run: |
          pnpm audit --prod --audit-level=high --json > audit.json || true
      - name: Check audit exceptions
        run: |
          python3 tools/check_pnpm_audit_exceptions.py \
            --audit frontend/audit.json \
            --exceptions .github/audit-exceptions.yml
