name: Restore v0.2.18 release notes

on:
  push:
    branches: [main]
    paths: [.github/workflows/release-recovery.yml]

permissions:
  contents: write

jobs:
  restore-notes:
    if: ${{ github.repository == 'SMOOONN/sub2api-xray' }}
    runs-on: ubuntu-latest
    container: python:3.12-bookworm
    steps:
      - name: Restore only the empty release body from the published tag
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          test -f /.dockerenv
          python - <<'PY'
          import base64
          import hashlib
          import json
          import os
          from urllib.request import Request, urlopen

          base = 'https://api.github.com/repos/SMOOONN/sub2api-xray'
          headers = {
              'Authorization': 'Bearer ' + os.environ['GITHUB_TOKEN'],
              'Accept': 'application/vnd.github+json',
              'Content-Type': 'application/json',
              'X-GitHub-Api-Version': '2022-11-28',
          }
          def request(path, data=None):
              payload = None if data is None else json.dumps(data).encode()
              method = 'GET' if data is None else 'PATCH'
              with urlopen(Request(base + path, data=payload, headers=headers, method=method), timeout=30) as response:
                  return json.load(response)

          tag = request('/git/ref/tags/v0.2.18-xray6')
          if tag['object']['sha'] != 'cb13e45563cd388b8dacd32899cf777aa853e1a2':
              raise RuntimeError('The published tag changed')
          source = request('/contents/docs/releases/v0.2.18-xray6_CN.md?ref=01ab5065c053894659eb729185b95df35a4f82ec')
          canonical = base64.b64decode(source['content'])
          if hashlib.sha256(canonical).hexdigest() != '85c2b58fa3190bdcbf36f0af1b77aae557d0dd45ca5156d82b87184ec92b2021':
              raise RuntimeError('Release notes differ from the approved source')
          release = request('/releases/tags/v0.2.18-xray6')
          if release['id'] != 427402968:
              raise RuntimeError('Unexpected release identity')
          desired = canonical.decode('utf-8')
          current_body = release.get('body') or ''
          if current_body == desired:
              print('Release notes already match the approved source.')
          else:
              if current_body.strip():
                  raise RuntimeError('Non-empty release notes were edited; do not overwrite them')
              assets_before = sorted((a['id'], a['name'], a['digest']) for a in release['assets'])
              updated = request('/releases/427402968', {'body': desired})
              if updated['body'] != desired:
                  raise RuntimeError('Release body readback differs')
              if sorted((a['id'], a['name'], a['digest']) for a in updated['assets']) != assets_before:
                  raise RuntimeError('Release assets unexpectedly changed')
              print('Restored the exact approved notes; tag and assets preserved.')
          PY
